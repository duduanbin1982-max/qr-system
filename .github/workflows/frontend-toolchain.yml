name: Frontend toolchain

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.10'
      - name: Check pins before dependency installation
        run: node frontend/scripts/check-toolchain.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r requirements.txt pytest==9.0.3
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:frontend
